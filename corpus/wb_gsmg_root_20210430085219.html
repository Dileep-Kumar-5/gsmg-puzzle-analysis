<script>window.config = {"appName":"GSMG","locale":"en","translations":{"ok":"Ok","cancel":"Cancel","error_alert_title":"Oops...","error_alert_text":"Something went wrong! Please try again.","token_expired_alert_title":"Session Expired!","token_expired_alert_text":"Please log in again to continue.","login":"Log In","register":"Register","page_not_found":"Page Not Found","go_home":"Go Home","logout":"Logout","email":"Email","remember_me":"Remember Me","password":"Password","forgot_password":"I can\u0027t remember","confirm_password":"Confirm Password","name":"Name","toggle_navigation":"Toggle navigation","home":"Home","you_are_logged_in":"You are logged in!","reset_password":"Reset Password","send_password_reset_link":"Send Password Reset Link","settings":{"page_title":"Settings","surplus_selling_title":"Surplus selling","surplus_selling_text":"Surplus is funds in your wallet that acts as the target currency for one of your selected markets, but was not acquired by the bot and is also not a base currency in any of your (other) selected markets.\u003C\/p\u003E\u003Cp\u003ESelect this option if you would like the bot to sell this surplus for you on this market. Every 15-25 minutes the bot will try to place an order for approximately 3% of your surplus, until all surplus is on order. \u003C\/p\u003E\u003C\/p\u003EOptionally, you can specify a minimum sell price.\u003C\/p\u003E\u003Cp\u003ENote that this option is not affected by your allocation configuration for this market.","allow_buy_above_trsl_title":"Allow buys above trailing stop","allow_buy_above_trsl_text":"\u003Cp\u003EIf this option is selected, then the bot may place buy orders above an existing trailing sell limit order. Otherwise it will not do that, which is the default behaviour.\u003C\/p\u003E\n\u003Cp\u003EThe reason to enable this feature is that sometimes the stop loss is trailing at a rather large distance, hence the highest buy orders will also be placed rather low. This may reduce the activity of the bot.\u003C\/p\u003E\n\u003Cp\u003EWhen this feature is enabled, it may look odd that the bot will be buying higher than it is selling. But it should be kept in mind that once a trailing stop is placed, the profits are already locked in and the bot is just biding its time to try to make them bigger.\u003C\/p\u003E","trade_engine_aggressiveness_title":"Trade engine aggressiveness","trade_engine_aggressiveness_text":"The trade engine model aggressiveness is expressed as a percentage. At the 0% level, the model is very convservative and at the 220% level, the model will be very aggressive. More aggression results in larger buy orders and also more expected profit. On the flip side, however, the trade engine will acquire alt coins at a higher rate. Therefore, if your selected market crashes, it is more likely to convert your available base currency into the alt coin, draining your account. The default is 20% and at 100% the order quantities may be up to 3 times larger.","trade_engine_aggressiveness_error":"Value must be between 1 and 220 and is rounded to the nearest integer.","optimized_trade_profit_pct_title":"Optimized trade profit percentage","optimized_trade_profit_pct_text":"\u003Cp\u003EThe minimum trade profit percentage is used by the trade engine to determine the minimum price of sell orders. When a buy order has been filled, then the trade engine will attempt to sell the acquired funds with at least this percentage as profit (before GSMG fee).\u003C\/p\u003E\u003Cp\u003EGSMG evaluates an optimimum for this value by virtually running the trading model on the price data of the last 250 days for this market. It does this for various values of the minimum trade profit percentage. The changes in base currency during each run are recorded and are used to calculated a sharpe ratio. The minimum trade profit percentage that led to the largest sharpe ratio is used by the bot if you enable this feature.\u003C\/p\u003E\u003Cp\u003ETo avoid a bull\/bear bias, the price data is slightly tilted such that the price at the beginning of each run is the same as that at the end. The optimisation is run on a daily basis and if an optimum could not be established, the minimum trade profit percentage defaults to 1%.\u003C\/p\u003E\u003Cp\u003E ","min_trade_profit_pct_title":"Minimum trade profit percentage","min_trade_profit_pct_text":"The minimum trade profit percentage is used by the trade engine to determine the minimum price of sell orders. When a buy order has been closed, the trade engine will attempt to sell the acquired crypto with at least this percentage as profit, or close to it. Note that the trade engine has various smart mechanisms that may cause it to override this number and place the sell for more profit (but never for significantly less).","min_trade_profit_pct_error":"The minimum trade profit has to be at least 0.01%","max_buy_price_title":"Maximum buy price","max_buy_price_text":"The max buy price feature allows to set a maximum price for the alt coin on this market, possibly overriding the internal value of the bot itself. The value to enter should be the the price of the alt coin expressed in units of the base currency of this market (usually, BTC or ETH). Once a value is submitted here, the bot will cancel all outstanding buy orders above this value and place new buy orders only at or below this value.","max_buy_price_error":"Value must be positive or leave empty to disable the maximum buy price.","min_sell_price_error":"Value must be positive or leave empty to disable the minimum sell price.","max_sell_price_hint_error":"Value must be positive or leave empty to disable the maximum sell price.","min_sell_price_title":"Minimum sell price","max_sell_price_hint_title":"Maximum sell price","min_sell_price_text":"If you set a `minumum sell price` for a market, the bot will not place sells below that value. If you set a `maximum sell price hint` then the bot will try to place no sell orders above that value on that market. It may occur that the bot cannot comply with the `maximum sell price hint` without selling for a profit less than 1%. In that case it will place the sell as low as to have at least 1% profit. This feature may override the `minimum trade profit percentage` setting.","max_sell_price_hint_text":"If you set a `minumum sell price` for a market, the bot will not place sells below that value. If you set a `maximum sell price hint` then the bot will try to place no sell orders above that value on that market. It may occur that the bot cannot comply with the `maximum sell price hint` without selling for a profit less than 1%. In that case it will place the sell as low as to have at least 1% profit. This feature may override the `minimum trade profit percentage` setting.","trailing_stop_loss_title":"Trailing sell","trailing_stop_loss_text":"\u003Cp\u003EThe \u0022Trailing Stop\u0022 feature attempts to \u0022lock in\u0022 profit and to keep locking in more as the market keeps moving in your favour.\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003EIt works in the following way:\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cul\u003E\u003Cli\u003EThe bot will place all new sell orders a couple of percent higher than \u0022normal\u0022. With \u0022normal\u0022 being the price where it \u0022normally\u0022 would have been given your configured minimum trade percentage.\u003C\/li\u003E\u003Cli\u003EIf the market price has risen to above the \u0022normal\u0022 price plus a small amount (usually less than 1%), then the higher-up limit order is replaced by a stop loss limit order at the \u0022normal\u0022 price.\u003C\/li\u003E\u003Cli\u003EIf the market keeps moving in your favour, then the stop loss limit order will be \u0022lifted\u0022 as much as possible, keeping some distance to it (usually 1-2%) as \u0022wiggle space\u0022. This is the \u0022trailing\u0022 part of it all.\u003C\/li\u003E\u003Cli\u003EIf the market keeps moving in your favour and the current market price exceeds the \u0022normal\u0022 prices of any other open higher-up limit orders, then these will be cancelled and their quantities will be added to the trailing sell limit order.\u003C\/li\u003E\u003C\/ul\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003EAbout risks:\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cul\u003E\u003Cli\u003EThere is some loss in efficiency as the minimum trade price is effectively increased by a small amount (usually less than 1%)\u003C\/li\u003E\u003Cli\u003EThere is also some efficiency loss because the code may be just too late to drop the limit sell and the market has moved already to your disadvantage.\u003C\/li\u003E\u003Cli\u003EIn rare cases, the market price just \u0022falls through\u0022 the stop loss limit order too fast for it to be triggered and the coin does not get sold at that moment.\u003C\/li\u003E\u003C\/ul\u003E\u003C\/p\u003E","bem_pct_title":"Buy entry modulation","bem_pct_text":"\u003Cp\u003EThe buy entry modulation percentage allows for a systematic manual adjustment of the highest buy order for this\n    market. The price at which the highest buy order normally is placed will be changed by this percentage. This can be\n    upward towards the market price or downwards.\u003C\/p\u003E\n\u003Cp\u003EThis is useful if you believe that the bot systematically places the highest buy orders too close to the market price\n    or too far away.\u003C\/p\u003E\n\u003Cp\u003EExample: If the bot would place the highest buy order at 0.01 BTC and the buy modulation is set to -5, then the bot\n    will place the highest buy not above 0.0095 BTC.\u003C\/p\u003E\n\u003Cp\u003ENote: If a maximum buy price is configured, then that may override this setting. Also, the bot will never place a buy\n    higher than the last known market price.\u003C\/p\u003E","bem_pct_error":"The buy entry modulation percentage should be between -100% and 100%"},"market_actions":{"release_funds_title":"Releasing reserved funds","release_funds_text":"Reserved funds are reserved by the bot for this specific trade pair (market) with the intention to sell them there.\u003Cbr\/\u003E\u003Cbr\/\u003EHowever, sometimes one wants to release these funds with the intention to withdraw them or to use them as base currency on some other market(s).\u003Cbr\/\u003E\u003Cbr\/\u003EThe funds can be released by making the bot forget (forever!) about (part of) its buy history. Check the historic buy orders in the list to release funds and confirm.\u003Cbr\/\u003E\u003Cbr\/\u003EConsider this example to clarify things further: suppose 0.1 ETH was acquired on BTC-ETH. Then that amount of ETH would be \u0022reserved for selling\u0022 on BTC-ETH only. Hence, this amount of ETH would not be available as base currency on, for example, ETH-ADA.\u003Cbr\/\u003E\u003Cbr\/\u003ENote: Should you choose to release a part of the ETH from the above example, with the intention to withdraw the ETH from your account, then it is advised to deselect all markets that use ETH as base currency and wait for the next cycle to complete (check the status timestamp on the dashboard). Then withdraw the funds and re-select the deselected markets. Otherwise, the bot will use the ETH on these markets in its next cycle."},"profile":"Profile","your_info":"Your Info","info_updated":"Your info has been updated!","update":"Update","your_password":"Your Password","password_updated":"Your password has been updated!","new_password":"New Password","login_with":"Login with","register_with":"Register with","send":"Send","markets":"Markets","update-deposit-address":"Update deposit address","add-deposit-address":"Add deposit address","page-dashboard":"Dashboard","not_applicable":"Not applicable","dashboard":{"fractional_account_value_title":"Fractional account value","fractional_account_value_text":"\u003Cp\u003E\n    The \u0022fractional account value\u0022 for a base currency is the current worth of all funds managed by the bot restricted to\n    the markets with that base currency.\n\u003C\/p\u003E\n\u003Cp\u003E\n    It is calculated as follows:\n\u003C\/p\u003E\n\u003Col\u003E\n    \u003Cli\u003EThe total amount of base currency in the user wallet on the exchange, \u003Cstrong\u003Eminus\u003C\/strong\u003E\u003C\/li\u003E\n    \u003Cli\u003Eany base currency that was acquired by the bot on \u0022other\u0022 markets that coincidentally have this base currency as\n        target currency, \u003Cstrong\u003Eplus\u003C\/strong\u003E\u003C\/li\u003E\n    \u003Cli\u003Ethe \u003Cem\u003Ecurrent worth\u003C\/em\u003E of all acquired coin on the markets for this base currency.\u003C\/li\u003E\n\u003C\/ol\u003E\n\u003Cbr\u003E\n\u003Cp\u003E\n    Consider this example:\n\u003C\/p\u003E\n\u003Cp\u003E\n    A user has 1 BTC, 10 ETH and 5000 ADA in their wallet and is trading on Binance:ETHBTC and Binance:ADAETH, where 4\n    ETH was acquired on Binance:ETHBTC.\n\u003C\/p\u003E\n\u003Cp\u003E\n    Assuming the 5000 ADA is currenty worth 1 ETH, then the \u0022fractional account value\u0022 for ETH is: 10 (in wallet) - 4\n    (from \u0022other\u0022 markets) + 1 (current worth of ADA in ETH).\n\u003C\/p\u003E\n\u003Cp\u003E\n    Note: For this value to be calculated properly, it is important to keep the \u0022Accumulated Funds\u0022 in sync with the\n    wallet on the exchange. See also the article on \u0022\u003Ca target=\u0027_blank\u0027\n                                                        href=\u0027https:\/\/intercom.help\/gsmg\/en\/articles\/2506867-release-reserved-funds\u0027\u003ERelease\n    reserved funds\u003C\/a\u003E\u0022.\n\u003C\/p\u003E\n"}},"githubAuth":null};</script>
