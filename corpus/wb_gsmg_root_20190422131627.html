<script>window.config = {"appName":"GSMG","locale":"en","translations":{"ok":"Ok","cancel":"Cancel","error_alert_title":"Oops...","error_alert_text":"Something went wrong! Please try again.","token_expired_alert_title":"Session Expired!","token_expired_alert_text":"Please log in again to continue.","login":"Log In","register":"Register","page_not_found":"Page Not Found","go_home":"Go Home","logout":"Logout","email":"Email","remember_me":"Remember Me","password":"Password","forgot_password":"I can\u0027t remember","confirm_password":"Confirm Password","name":"Name","toggle_navigation":"Toggle navigation","home":"Home","you_are_logged_in":"You are logged in!","reset_password":"Reset Password","send_password_reset_link":"Send Password Reset Link","settings":{"page_title":"Settings","surplus_selling_title":"Surplus selling","surplus_selling_text":"Surplus is alt coin on your balance, which was not acquired by the bot itself. Select this option if you would like to bot to sell this surplus for you on this market. Approximately every 15-20 minutes it will try to place an order for approximately 3% of your surplus, until all surplus is on order. Optionally, you can specify a minimum sell price per coin for this market.","trade_engine_aggressiveness_title":"Trade engine aggressiveness","trade_engine_aggressiveness_text":"The trade engine model aggressiveness is expressed as a percentage. At the 0% level, the model is very convservative and at the 220% level, the model will be very aggressive. More aggression results in larger buy orders and also more expected profit. On the flip side, however, the trade engine will acquire alt coins at a higher rate. Therefore, if your selected market crashes, it is more likely to convert your available base currency into the alt coin, draining your account. The default is 20% and at 100% the order quantities may be up to 3 times larger.","trade_engine_aggressiveness_error":"Value must be between 1 and 220 and is rounded to the nearest integer.","min_trade_profit_pct_title":"Minimum trade profit percentage","min_trade_profit_pct_text":"The minimum trade profit percentage is used by the trade engine to determine the minimum price of sell orders. When a buy order has been closed, the trade engine will attempt to sell the acquired crypto with at least this percentage as profit, or close to it. Note that the trade engine has various smart mechanisms that may cause it to override this number and place the sell for more profit (but never for significantly less).","min_trade_profit_pct_error":"The minimum trade profit has to be at least 0.01%","max_buy_price_title":"Maximum buy price","max_buy_price_text":"The max buy price feature allows to set a maximum price for the alt coin on this market, possibly overriding the internal value of the bot itself. The value to enter should be the the price of the alt coin expressed in units of the base currency of this market (usually, BTC or ETH). Once a value is submitted here, the bot will cancel all outstanding buy orders above this value and place new buy orders only at or below this value.","max_buy_price_error":"Value must be positive or leave empty to disable the maximum buy price.","min_sell_price_error":"Value must be positive or leave empty to disable the minimum sell price.","max_sell_price_hint_error":"Value must be positive or leave empty to disable the maximum sell price.","min_sell_price_title":"Minimum sell price","max_sell_price_hint_title":"Maximum sell price","min_sell_price_text":"If you set a `minumum sell price` for a market, the bot will not place sells below that value. If you set a `maximum sell price hint` then the bot will try to place no sell orders above that value on that market. It may occur that the bot cannot comply with the `maximum sell price hint` without selling for a profit less than 1%. In that case it will place the sell as low as to have at least 1% profit. This feature may override the `minimum trade profit percentage` setting.","max_sell_price_hint_text":"If you set a `minumum sell price` for a market, the bot will not place sells below that value. If you set a `maximum sell price hint` then the bot will try to place no sell orders above that value on that market. It may occur that the bot cannot comply with the `maximum sell price hint` without selling for a profit less than 1%. In that case it will place the sell as low as to have at least 1% profit. This feature may override the `minimum trade profit percentage` setting."},"market_actions":{"release_funds_title":"Releasing reserved funds","release_funds_text":"Reserved funds are reserved by the bot for this specific trade pair (market) with the intention to sell them there.\u003Cbr\/\u003E\u003Cbr\/\u003EHowever, sometimes one wants to release these funds with the intention to withdraw them or to use them as base currency on some other market(s).\u003Cbr\/\u003E\u003Cbr\/\u003EThe funds can be released by making the bot forget (forever!) about (part of) its buy history. Check the historic buy orders in the list to release funds and confirm.\u003Cbr\/\u003E\u003Cbr\/\u003EConsider this example to clarify things further: suppose 0.1 ETH was acquired on BTC-ETH. Then that amount of ETH would be \u0022reserved for selling\u0022 on BTC-ETH only. Hence, this amount of ETH would not be available as base currency on, for example, ETH-ADA.\u003Cbr\/\u003E\u003Cbr\/\u003ENote: Should you choose to release a part of the ETH from the above example, with the intention to withdraw the ETH from your account, then it is advised to deselect all markets that use ETH as base currency and wait for the next cycle to complete (check the status timestamp on the dashboard). Then withdraw the funds and re-select the deselected markets. Otherwise, the bot will use the ETH on these markets in its next cycle."},"profile":"Profile","your_info":"Your Info","info_updated":"Your info has been updated!","update":"Update","your_password":"Your Password","password_updated":"Your password has been updated!","new_password":"New Password","login_with":"Login with","register_with":"Register with","send":"Send","markets":"Markets","update-deposit-address":"Update deposit address","add-deposit-address":"Add deposit address","page-dashboard":"Dashboard","not_applicable":"Not applicable"},"githubAuth":null};</script>
