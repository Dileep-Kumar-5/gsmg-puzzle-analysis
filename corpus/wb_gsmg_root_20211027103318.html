<script>window.config = {"appName":"GSMG","locale":"en","translations":{"ok":"Ok","cancel":"Cancel","error_alert_title":"Oops...","error_alert_text":"Something went wrong! Please try again.","token_expired_alert_title":"Session Expired!","token_expired_alert_text":"Please log in again to continue.","error_429_alert_title":"Error loading page.","error_429_alert_text":"Server temporarily overloaded. Please try again in a bit. Apologies for the inconvenience.","login":"Log In","register":"Register","page_not_found":"Page Not Found","go_home":"Go Home","logout":"Logout","email":"Email","remember_me":"Remember Me","password":"Password","forgot_password":"I can\u0027t remember","confirm_password":"Confirm Password","name":"Name","toggle_navigation":"Toggle navigation","home":"Home","you_are_logged_in":"You are logged in!","reset_password":"Reset Password","send_password_reset_link":"Send Password Reset Link","settings":{"page_title":"Settings","surplus_selling_title":"Surplus selling","surplus_selling_text":"Surplus is funds in your wallet that acts as the \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Ebase\u003C\/a\u003E currency for one of your selected markets, but was not acquired by the bot and is also not a \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Equote\u003C\/a\u003E currency in any of your (other) selected markets.\u003C\/p\u003E\u003Cp\u003ESelect this option if you would like the bot to sell this surplus for you on this market. Every few hours the bot will try to place an order for approximately 3% of your surplus amount, until all of it is on order. \u003C\/p\u003E\u003C\/p\u003EOptionally, you can specify a minimum sell price.\u003C\/p\u003E","allow_buy_above_trsl_title":"Allow buys above trailing stop","allow_buy_above_trsl_text":"\u003Cp\u003EIf this option is selected, then the bot may place buy orders above an existing trailing sell limit order. Otherwise it will not do that, which is the default behaviour.\u003C\/p\u003E\n\u003Cp\u003EThe reason to enable this feature is that sometimes the stop loss is trailing at a rather large distance, hence the highest buy orders will also be placed rather low. This may reduce the activity of the bot.\u003C\/p\u003E\n\u003Cp\u003EWhen this feature is enabled, it may look odd that the bot will be buying higher than it is selling. But it should be kept in mind that once a trailing stop is placed, the profits are already locked in and the bot is just biding its time to try to make them bigger.\u003C\/p\u003E","trade_engine_aggressiveness_title":"Trade engine aggressiveness","trade_engine_aggressiveness_text":"\u003Cp\u003EThe trade engine aggressiveness determines the order sizes.\u003C\/p\u003E \u003Cp style=\u0022margin-top:20px;\u0022\u003EIt is expressed as a percentage. At the 1% level, the model is very convservative and at the 220% level, the model will be very aggressive. More aggression results in larger buy orders, hence also more expected profit. On the flip side, however, the trade engine will acquire alt coins at a (much) higher rate. Therefore, if your selected market crashes, it is more likely to convert your available \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Equote\u003C\/a\u003E currency into the base coin, draining your account. \u003C\/p\u003E  \u003Cp style=\u0022margin-top:20px;\u0022\u003EThe default is 20% and at 100% the order quantities may be up to 3 times larger.\u003C\/p\u003E                \u003Cp style=\u0022margin-top:20px;\u0022\u003EWe strongly recommend to set the aggression to 15-20%, at least until you have developed a good feel for how this bot behaves during bear markets. \u003C\/p\u003E","trade_engine_aggressiveness_error":"Value must be between 1 and 220 and is rounded to the nearest integer.","optimized_trade_profit_pct_title":"Optimised trade profit percentage","optimized_trade_profit_pct_text":"\u003Cp\u003EThe minimum trade profit percentage is used by the trade engine to determine the minimum price of sell orders. When a buy order has been filled, then the trade engine will attempt to sell the acquired funds with at least this percentage as profit (before GSMG fee).\u003C\/p\u003E\u003Cp\u003EGSMG evaluates an optimimum for this value by virtually running the trading model on the price data of the last 250 days for this market. It does this for various values of the minimum trade profit percentage. The changes in \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Equote\u003C\/a\u003E currency during each run are recorded and are used to calculated a sharpe ratio. The minimum trade profit percentage that led to the largest sharpe ratio is used by the bot if you enable this feature.\u003C\/p\u003E\u003Cp\u003ETo avoid a bull\/bear bias, the price data is slightly tilted such that the price at the beginning of each run is the same as that at the end. The optimisation is run on a daily basis and if an optimum could not be established, the minimum trade profit percentage defaults to 1%.\u003C\/p\u003E\u003Cp\u003E ","min_trade_profit_pct_title":"Minimum trade profit percentage","min_trade_profit_pct_text":"The minimum trade profit percentage is the minimal profit percentage for a trade.\u003Cp style=\u0022margin-top:20px;\u0022\u003E If you set it to 1%, then the trade engine will place sell orders such that at at least 1% profit is booked on earlier acquired funds.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003EThis is the net profit after having paid the exchange commissions of both buying and selling the funds. \u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E Note that if you are on the Standard subscription, you pay a GSMG commission from your fuel credits. This is not taken into account when determining the net profit.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E Note also that the trade engine regularly places sell orders (much) higher than strictly necessary to obtain the configured minimum trade profit. This has various reasons and is nothing to worry about as you will come to see.\u003C\/p\u003E","min_trade_profit_pct_error":"The minimum trade profit has to be at least 0.01%","max_buy_price_title":"Maximum buy price","max_buy_price_text":"The max buy price feature allows to set a maximum price for the \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Ebase\u003C\/a\u003E coin on this market. \u003Cp style=\u0022margin-top:20px;\u0022\u003E The value to enter should be the the price of the \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Ebase\u003C\/a\u003E  coin expressed in units of the \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Equote\u003C\/a\u003E currency of this market. \u003Cp style=\u0022margin-top:20px;\u0022\u003E Once a price is submitted here, the bot will cancel any outstanding buy orders above it and place new buy orders only at or below it.","max_buy_price_error":"Value must be positive or leave empty to disable the maximum buy price.","min_sell_price_error":"Value must be positive or leave empty to disable the minimum sell price.","max_sell_price_hint_error":"Value must be positive or leave empty to disable the maximum sell price.","min_sell_price_title":"Minimum sell price","max_sell_price_hint_title":"Maximum sell price","min_sell_price_text":"If you set a `minumum sell price` for a market, the bot will not place sells below that value. If you set a `maximum sell price hint` then the bot will try to place no sell orders above that value on that market. It may occur that the bot cannot comply with the `maximum sell price hint` without selling for a profit less than 1%. In that case it will place the sell as low as to have at least 1% profit. This feature may override the `minimum trade profit percentage` setting.","max_sell_price_hint_text":"If you set a `minumum sell price` for a market, the bot will not place sells below that value. If you set a `maximum sell price hint` then the bot will try to place no sell orders above that value on that market. It may occur that the bot cannot comply with the `maximum sell price hint` without selling for a profit less than 1%. In that case it will place the sell as low as to have at least 1% profit. This feature may override the `minimum trade profit percentage` setting.","trailing_stop_loss_title":"Trailing sell","trailing_stop_loss_text":"\u003Cp\u003EThe \u0022Trailing Stop\u0022 feature attempts to \u0022lock in\u0022 profit and to keep locking in more as the market keeps moving in your favour.\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003EIt works in the following way:\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cul\u003E\u003Cli\u003EThe bot will place all new sell orders a couple of percent higher than \u0022normal\u0022. With \u0022normal\u0022 being the price where it \u0022normally\u0022 would have been given your configured minimum trade percentage.\u003C\/li\u003E\u003Cli\u003EIf the market price has risen to above the \u0022normal\u0022 price plus a small amount (usually less than 0.1%), then the higher-up limit order is replaced by a stop loss limit order at the \u0022normal\u0022 price.\u003C\/li\u003E\u003Cli\u003EIf the market keeps moving in your favour, then the stop loss limit order will be \u0022lifted\u0022 as much as possible, keeping some distance to it (usually 0.1-1%) as \u0022wiggle space\u0022. This is the \u0022trailing\u0022 part of it all.\u003C\/li\u003E\u003Cli\u003EIf the market keeps moving in your favour and the current market price exceeds the \u0022normal\u0022 prices of any other open higher-up limit orders, then these will be cancelled and their quantities will be added to the trailing sell limit order.\u003C\/li\u003E\u003C\/ul\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003EAbout risks:\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cul\u003E\u003Cli\u003EThere is some loss in efficiency as the minimum trade price is effectively increased by a small amount (usually less than 0.1%)\u003C\/li\u003E\u003Cli\u003EThere is also some efficiency loss because the code may be just too late to drop the limit sell and the market has moved already to your disadvantage.\u003C\/li\u003E\u003Cli\u003EIn rare cases, the market price just \u0022falls through\u0022 the stop loss limit order too fast for it to be triggered and the coin does not get sold at that moment.\u003C\/li\u003E\u003C\/ul\u003E\u003C\/p\u003E","bem_pct_title":"Buy entry modulation","bem_pct_text":"\u003Cp\u003EThe buy entry modulation percentage allows for a systematic manual adjustment of the highest buy order for this\n    market. The price at which the highest buy order normally is placed will be changed by this percentage. This can be\n    upward towards the market price or downwards.\u003C\/p\u003E\n\u003Cp\u003EThis is useful if you believe that the bot systematically places the highest buy orders too close to the market price\n    or too far away.\u003C\/p\u003E\n\u003Cp\u003EExample: If the bot would place the highest buy order at 0.01 BTC and the buy modulation is set to -5, then the bot\n    will place the highest buy not above 0.0095 BTC.\u003C\/p\u003E\n\u003Cp\u003ENote: If a maximum buy price is configured, then that may override this setting. Also, the bot will never place a buy\n    higher than the last known market price.\u003C\/p\u003E","bem_pct_error":"The buy entry modulation percentage should be between -100% and 100%","hodl_amount_title":"HODL amount","hodl_amount_text":"The HODL amount is the amount of funds that the trade engine will hodl for you.  To \u0022hodl\u0022 is crypto slang and it means \u0022not selling\u0022.\u003Cp style=\u0022margin-top:20px;\u0022\u003E For example, on the market ADA\/USDT, the trade engine could hodl ADA for you.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E The trade engine will only hodl funds that it acquired itself.\u003Cp style=\u0022margin-top:20px;\u0022\u003E Also, the trade engine will always hodl the most expensively acquired funds. That way it can take profit earlier, on non-hodl funds.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E Note that it is possible to have the trade engine hodl funds for you, that it did not acquire itself. To do this, manually add an historic buy order on the \u003Ca target=\u0027_blank\u0027 href=\u0022\/openorders\u0022\u003Eorders\u003C\/a\u003E page for the amount you would like to hodl. This will cause the trade engine to absorb this amount as if it had acquired it itself. After that, it will be able to hodl those funds for you.\u003C\/p\u003E","hodl_amount_error":"Invalid HODL amount","hodl_amount_allows_numbers_error":"Invalid HODL amount"},"market_actions":{"release_funds_title":"Buy history and releasing reserved funds","release_funds_text":"The buy order history consists of all filled buy orders of which the acquired funds are not yet sold by the trade engine. The trade engine reserves these funds in your wallet for selling. That means that acquired BNB on BNB\/USDT will not be used to place buy orders on, for example, XRP\/BNB. \u003Cbr\/\u003E\u003Cbr\/\u003EHowever, sometimes you want to release these funds with the intention to withdraw them from your wallet or to use them as \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Equote\u003C\/a\u003E currency on some other market(s).\u003Cbr\/\u003E\u003Cbr\/\u003EThe funds can be released by making the bot forget about (part of) its buy history. Check the historic buy orders in the list to release funds and confirm.\u003Cbr\/\u003E\u003Cbr\/\u003EConsider this example to clarify things further: suppose 0.1 ETH was acquired on ETH\/BTC. Then that amount of ETH would be \u0022reserved for selling\u0022 on ETH\/BTC only. Hence, this amount of ETH would not be available as \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Equote\u003C\/a\u003E currency on, for example, ADA\/ETH.\u003Cbr\/\u003E"},"profile":"Profile","your_info":"Your Info","info_updated":"Your info has been updated!","update":"Update","your_password":"Your Password","password_updated":"Your password has been updated!","new_password":"New Password","login_with":"Login with","register_with":"Register with","send":"Send","markets":"Markets","update-deposit-address":"Update deposit address","add-deposit-address":"Add deposit address","page-dashboard":"Dashboard","not_applicable":"Not applicable","dashboard":{"fractional_account_value_title":"Fractional account value","fractional_account_value_text":"\u003Cp\u003E\n    The \u0022fractional account value\u0022 for a \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Equote\u003C\/a\u003E currency is the current estimated worth of your wallet restricted to\n    your market selection markets with that quote currency.\n\u003C\/p\u003E\n\u003Cp\u003E\n    It is calculated as follows:\n\u003C\/p\u003E\n\u003Col\u003E\n    \u003Cli\u003EThe total amount of quote currency in the user wallet on the exchange, \u003Cstrong\u003Eminus\u003C\/strong\u003E\u003C\/li\u003E\n    \u003Cli\u003Eany quote currency that was acquired by the bot on \u0022other\u0022 markets that coincidentally have this quote currency as\n         \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Ebase\u003C\/a\u003E currency, \u003Cstrong\u003Eplus\u003C\/strong\u003E\u003C\/li\u003E\n    \u003Cli\u003Ethe \u003Cem\u003Ecurrent worth\u003C\/em\u003E of all acquired coin on the markets for this quote currency.\u003C\/li\u003E\n\u003C\/ol\u003E\n\u003Cbr\u003E\n\u003Cp\u003E\n    Consider this example:\n\u003C\/p\u003E\n\u003Cp\u003E\n    A user has 1 BTC, 10 ETH and 5000 ADA in their wallet and is trading on Binance:ETH\/BTC and Binance:ADA\/ETH, where 4\n    ETH was acquired on Binance:ETH\/BTC.\n\u003C\/p\u003E\n\u003Cp\u003E\n    Assuming the 5000 ADA is currenty worth 1 ETH, then the \u0022fractional account value\u0022 for ETH is: 10 (in wallet) - 4\n    (from \u0022other\u0022 markets) + 1 (current worth of ADA in ETH).\n\u003C\/p\u003E\n\u003C\/p\u003E\n"},"information":{"profit_worth_usd":{"title":"Profit worth (USD)","description":"The \u0022Profit worth (USD)\u0022 shows the estimated value of the trade profit \u003Ci\u003Eworth\u003C\/i\u003E in USD. The conversion to USD was done using the exchange rate that was current at the moment of processing the filled sell order by the trade engine. That is usually less than 30 minutes after the sell order was actually filled, but it still an estimate."},"account_value":{"title":"Estimated account value","description":"As the name indicates, this is an \u003Ci\u003Eestimate\u003C\/i\u003E of the value of your spot wallet at the exchange. Since it is only an estimate, it is given with limited precision. \u003Cp style=\u0022margin-top:20px;\u0022\u003EThe estimate is shown in at least USD and BTC. If the trade engine is active on markets with other \u003Ca target=\u0027_blank\u0027  href=\u0022http:\/\/help.gsmg.io\/en\/articles\/5524092-what-is-the-base-quote-target-currency\u0022\u003Equote\u003C\/a\u003E currencies, like ETH, then the estimate is also shown in those currencies. \u003Cp style=\u0022margin-top:20px;\u0022\u003E Note that the estimate may be as old as the last time the trade engine status was updated (see \u0022Trade engine status\u0022), which means the applied conversion rates may no longer be accurate (this is crypto after all). \u003Cp style=\u0022margin-top:20px;\u0022\u003EAlso, in rare cases, it may happen that some odd coin in your wallet could not be converted to USD. In that case the trade engine may use the conversion rate to USDT instead. If that fails as well, the funds will not be included in the estimate."},"account_currently_managed_value":{"title":"Currently managed value","description":"The maximum value that the trade engine will manage in your behalf is determined by your current subscription. \u003Cp style=\u0022margin-top:20px;\u0022\u003E  This \u0022managed value\u0022 is determined on a per-exchange basis as the sum total of:\u003Col\u003E\u003Cli\u003Ethe funds in open buy orders and\u003C\/li\u003E\u003Cli\u003Ethe current value of acquired funds represented by your buy order history.\u003C\/li\u003E\u003C\/ol\u003E  \u003Cp style=\u0022margin-top:20px;\u0022\u003E  The acquired funds from point 2 are usually in open sell orders if the trade engine is active on that market. \u003Cp style=\u0022margin-top:20px;\u0022\u003ENote that the maximum value is on a \u0022per exchange\u0022 basis. So the limit applies to each exchange seperately and not to the sum total of managed values over multiple exchanges.  \u003Cp style=\u0022margin-top:20px;\u0022\u003E  In case your account exceeds this maximum value for an exchange, then the trade engine will ignore the excess. It will then simply leave some funds untouched instead of placing it in orders. This ofcourse may result in underfunded markets."},"account_selected_markets":{"title":"Selected markets","description":"Your current subscription puts a limit on the number of markets that the trade engine will process for you. \u003Cp style=\u0022margin-top:20px;\u0022\u003E  A market, or trading pair, is counted as \u0022selected\u0022 if the trade engine is currently active on that market, meaning it is trying to buy and\/or sell funds on that market.  \u003C\/ol\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E  Note that the number of allowed markets is taken as the sum total over all your connected (and enabled) exchanges. For example, 3 selected markets on Binance and 1 on Huobi counts as 4.\u003Cp style=\u0022margin-top:20px;\u0022\u003E  If you have more markets selected than the subscription allows, then the trade engine will not process the excess markets and you will find a corresponding warning in the status message field."},"unrealised_losses":{"title":"Unrealised loss","description":"The \u0022Unrealised loss\u0022 is the estimated difference between the original cost of acquired funds and their current worth. It is \u0022unrealised\u0022, because as long as you don\u0027t sell at the current price, there is no loss realised.  It is normal to have some unrealised loss, as the trade engine is waiting to sell the acquired funds for profit. \u003Cp style=\u0022margin-top:20px;\u0022\u003E The unrealised loss may well be negative. This means there is an unrealised profit. This happens if your acquired funds are worth more now than when they were acquired.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E Note that the unrealised loss is calculated from the current buy order history and the trade engine may not have checked whether the funds still exist in your wallet. This may happen if you have deselected a market where some acquired funds were not yet sold.\u003C\/p\u003E"},"markets_target_allocation":{"title":"Target allocation","description":"The \u0022target allocation\u0022 allows you to allocate a percentage of the funds in your wallet to the trade engine for each market that you have selected.\u003Cp style=\u0022margin-top:20px;\u0022\u003E Any current allocation is indicated in green and red. A green bar indicates the allocation of funds in open buy orders. The red indicates the worth of funds that were acquired earlier and are waiting to be sold. \u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E \u003Cb\u003EExample\u003C\/b\u003E \u003Cbr\u003ESuppose you have selected BNB\/BTC on Binance and had set the target allocation to 35% (for example yesterday). Also suppose that the allocation in open buy orders (green) is currently 25% and the allocation in open sell orders (red) is 10%.\u003C\/p\u003E \u003Cp style=\u0022margin-top:20px;\u0022\u003E In this case, the 25% in open buy orders (green) exists as BTC in your wallet while the other 10% (red) exists in your wallet as BNB and was acquired earlier by the trade engine.\u003C\/p\u003E \u003Cp style=\u0022margin-top:20px;\u0022\u003E Now suppose that you change the target allocation from 35% to 25% by moving the slider to the left. The trade engine will now proceed to cancel open buy orders in order to work towards the new desired allocation of 25%.\u003C\/p\u003E \u003Cp style=\u0022margin-top:20px;\u0022\u003ENow suppose you move the slider even further to the left to 5%, into the red. To reach the target allocation, the trade engine has to cancel all buy orders. But this reduces the allocation to only 10%. The only way to further reduce the allocation from 10% to the desired 5% is to sell off the BNB. Although the trade engine will make every effort to do exactly this, it will depend on the market (and your settings, like the minimum trade profit percentage) whether the trade engine will manage.\u003C\/p\u003E    \u003Cp style=\u0022margin-top:20px;\u0022\u003E\u003Cb\u003ENotes\u003C\/b\u003E\u003Cbr\u003E\u003Cul\u003E\u003Cli\u003ETo determine the worth of the funds in \u0022red\u0022, a recent conversion rate was used, not the rate at which they were bought. \u003C\/li\u003E\u003Cli\u003EFunds that are waiting to be sold via manually added \u0022historic\u0022 buy orders or via the \u0022Surplus selling\u0022 feature are not included (in the \u0022red\u0022).\u003C\/li\u003E\u003Cli\u003EIt is possible to \u0022remove\u0022 the red forcibly by purging the current buy order history. This will make the trade engine \u0022forget\u0022 about the funds (BNB in the example above). Check out \u003Ca href=\u0022https:\/\/help.gsmg.io\/en\/articles\/2506867-release-reserved-funds\u0022\u003Ethis article\u003C\/a\u003E for how to do that.\u003C\/li\u003E\u003C\/ul\u003E\u003C\/p\u003E       "},"trade_history_buy_orders_id":{"title":"Order ID","description":"This specifies the exchange ID of the buy order, which originally acquired (part of) the funds that were sold via the sell order in this transaction.\u003Cp style=\u0022margin-top:20px;\u0022\u003E Note that sometimes you will see an order ID here that ends in an underscore and a number, for example: 21428475\u003Cb\u003E_3\u003C\/b\u003E. In such a case the GMSG trade engine broke up the funds, acquired with the original buy order, in multiple parts. In this example, the \u003Ci\u003Ethird\u003C\/i\u003E part was sold in this transaction.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E You should keep this in mind if you ever need to communicate the order ID to, for example, an exchange help desk.\u003C\/p\u003E"},"allocations_bag_size":{"title":"Bag size","description":"Your \u0022bag\u0022 for a particular market is the total of all funds, acquired by the trade engine, that it has not yet sold. For example, on the market ADA\/BTC, the bag would be all the acquired ADA \u003Ci\u003Eon this market\u003C\/i\u003E.\u003Cp style=\u0022margin-top:20px;\u0022\u003E When the bag size is expressed as a percentage, then the bag size \u003Ci\u003Eworth\u003C\/i\u003E is presented relative to the worth of all the funds on this market (i.e. the bag worth plus the funds in open buy orders).\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E If the trade engine has not yet acquired any funds yet on a market, then you have no bags yet and the relative bag size is 0%.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E If the acquired funds are currently worth exactly the same as the funds in open buy orders, then your relative bag size is 50%.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E If you have a market with some acquired funds, but there are no open buy orders, then the bag size will be 100%.\u003C\/p\u003E"},"gsmg_optimised_min_trade_profit_percentage":{"title":"GSMG optimised minimum trade profit percentage","description":"The GSMG systems regularly and automatically execute robust optimisation routines to determine an optimal value for the minimum trade profit percentage.\u003Cp style=\u0022margin-top:20px;\u0022\u003E This is done for each market individually using its price data of up to 100 days back.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E It is possible to \u0022follow\u0022 this optimised value so that the trade engine always uses the most up-to-date GSMG optimised minimum trade profit in your  behalf.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E Note that if you think that the market behaviour of the last 100 days is not representing the current market very well, you are encouraged to set your own value for the minimum trade profit percentage.\u003C\/p\u003E"},"funding_health_pct":{"title":"Funding health","description":"The funding health indicates how well the trade engine is funded for a market.\u003Cp style=\u0022margin-top:20px;\u0022\u003E The funding health is derived from the number of buy orders that the trade engine is able to place with the funds in your wallet that are available for this market.\u003C\/p\u003E\u003Cp style=\u0022margin-top:20px;\u0022\u003E Optimal performance of the trade engine depends on maintaining a certain spread of buy orders below the current market price. This is particularly important when the market keeps going down for a longer period of time and the trade engine is slowly accumulating bags.\u003C\/p\u003E \u003Cp style=\u0022margin-top:20px;\u0022\u003ENote that the funding health assumes default settings. For large values of the trade aggression or buy entry modulation all bets are off.\u003C\/p\u003E  \u003Cp style=\u0022margin-top:20px;\u0022\u003E See also  \u003Ca target=\u0027_blank\u0027 href=\u0027https:\/\/intercom.help\/gsmg\/en\/articles\/3628355-minimum-funds-required-rule-of-thumb\u0027\u003Ethis\u003C\/a\u003E article on funding.\u003C\/p\u003E"}}},"githubAuth":null};</script>
